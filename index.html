<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>웅진스킬원 Battle Card Generator v1</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0}
.wrap{max-width:1200px;margin:auto;padding:24px}
h1{margin:0 0 20px}
.panel,.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
select,button{padding:12px;width:100%;border:1px solid #ccc;border-radius:8px}
button{background:#0a66c2;color:#fff;font-weight:bold;cursor:pointer}
.card{margin-top:20px;display:none}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:10px;text-align:left}
th{background:#f0f4f8}
.badge{padding:4px 8px;border-radius:6px;font-size:12px}
.win{background:#dff5df}
ul{line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<h1>웅진스킬원 배틀카드 생성기 v1</h1>

<div class="panel">
<div class="grid">
<div>
<label>플랫폼</label>
<select id="platform">
<option>Udemy Business</option>
<option>LinkedIn Learning</option>
<option>Coursera</option>
<option>Degreed</option>
</select>
</div>

<div>
<label>경쟁사</label>
<select id="competitor">
<option>유밥</option>
<option>휴넷</option>
<option>인프런</option>
<option>패스트캠퍼스</option>
</select>
</div>

<div>
<label>고객 유형</label>
<select id="customer">
<option>대기업</option>
<option>중견기업</option>
<option>제조업</option>
<option>IT 기업</option>
<option>개발직군 중심</option>
</select>
</div>

<div>
<label>&nbsp;</label>
<button onclick="generate()">배틀카드 생성</button>
</div>
</div>
</div>

<div id="card" class="card"></div>
</div>

<script>
function generate(){
const p=document.getElementById('platform').value;
const c=document.getElementById('competitor').value;
const t=document.getElementById('customer').value;

const talking={
"Udemy Business":[
"글로벌 최신 AI/클라우드 콘텐츠 제공",
"개발자 선호도가 높음",
"210,000+ 콘텐츠 보유"
],
"LinkedIn Learning":[
"리더십/비즈니스 역량 특화",
"LinkedIn 프로필 연계",
"역량 기반 추천"
],
"Coursera":[
"Google·IBM·Meta 인증",
"대학 수준 학습경험",
"공인 수료증"
],
"Degreed":[
"LXP 기반 스킬 관리",
"스킬 갭 분석",
"멀티 콘텐츠 통합"
]
};

const html=`
<h2>${p} vs ${c}</h2>
<p><b>타겟 고객:</b> ${t}</p>

<h3>Executive Summary</h3>
<p>${p}는 ${t} 고객군에서 ${c} 대비 학습 확장성, 데이터 기반 운영, 글로벌 콘텐츠 측면에서 차별화됩니다.</p>

<h3>비교표</h3>
<table>
<tr>
<th>항목</th>
<th>${p}</th>
<th>${c}</th>
<th>판정</th>
</tr>
<tr>
<td>콘텐츠</td>
<td>글로벌 콘텐츠</td>
<td>국내 중심</td>
<td><span class="badge win">우위</span></td>
</tr>
<tr>
<td>플랫폼</td>
<td>엔터프라이즈 기능</td>
<td>제한적</td>
<td><span class="badge win">우위</span></td>
</tr>
<tr>
<td>확장성</td>
<td>글로벌 조직 지원</td>
<td>국내 위주</td>
<td><span class="badge win">우위</span></td>
</tr>
<tr>
<td>고객 성공 지원</td>
<td>CSM 운영</td>
<td>일반 지원</td>
<td><span class="badge win">우위</span></td>
</tr>
</table>

<h3>영업 메시지</h3>
<ul>
${talking[p].map(x=>`<li>${x}</li>`).join('')}
</ul>

<h3>반론 대응</h3>
<ul>
<li>비용: ROI 관점에서 학습 데이터와 활용률을 함께 비교</li>
<li>국내 콘텐츠: 글로벌 트렌드 학습 경쟁력 강조</li>
<li>도입 부담: 전담 CSM 온보딩 지원</li>
</ul>

<h3>제안 전략</h3>
<p>${t} 고객의 경우 조직 역량 체계 구축, AI 역량 확보, 학습 데이터 기반 운영을 중심으로 제안하는 것이 효과적입니다.</p>
`;

document.getElementById('card').innerHTML=html;
document.getElementById('card').style.display='block';
}
</script>
</body>
</html>
